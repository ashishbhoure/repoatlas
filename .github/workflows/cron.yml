# Scheduled jobs. Runs here rather than as Vercel Cron because the Vercel Hobby plan only
# allows daily crons. Needs repository secrets APP_URL (no trailing slash) and CRON_SECRET.
name: Scheduled jobs

on:
  schedule:
    - cron: "0 */6 * * *" # snapshots
    - cron: "30 */3 * * *" # alerts
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [snapshots, alerts]
        default: snapshots

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || (github.event.schedule == '30 */3 * * *' && 'alerts' || 'snapshots') }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl -fsS --retry 2 --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$JOB"
